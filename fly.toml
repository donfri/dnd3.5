# Fly.io config for the shared D&D table.
# First time:  fly launch --no-deploy --copy-config   (pick a unique app name)
#              fly volumes create dnd_saves --size 1
#              fly secrets set TABLE_PASSWORD=something-secret
#              fly deploy
#              fly scale count 1     # the game lives in memory: keep exactly ONE machine
app = "dnd35"
primary_region = "ord"   # Chicago: roughly halfway across the US

[build]

[env]
  DND35_SAVE_DIR = "/data"

[mounts]
  source = "dnd_saves"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody is connected (saves money); wakes when you open the page.
  # Your progress survives in the autosave on the volume.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"     # room for the neural narrator voices
