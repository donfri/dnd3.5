[project]
name = "dnd35-text"
version = "0.1.0"
description = "A D&D 3.5 text adventure with a computer Game Master"
requires-python = ">=3.8"
readme = "README.md"

[project.scripts]
dnd35 = "dnd35.game:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dnd35*"]
